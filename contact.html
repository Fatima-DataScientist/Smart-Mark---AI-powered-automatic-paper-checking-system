<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact SmartMark support">
  <title>Contact — SmartMark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/contact.css">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main>
    <div class="deco-blob blob-one"></div>
    <div class="deco-blob blob-two"></div>
    <section class="contact-card" aria-labelledby="page-title">
      <div class="contact-intro">
        <p class="eyebrow">SMARTMARK SUPPORT</p>
        <h1 id="page-title">How can we help?</h1>
        <p>Send us a message and the SmartMark team will get back to you as soon as possible.</p>
        <div class="support-note"><span aria-hidden="true">✦</span><div><strong>Support hours</strong><br>Monday–Friday, 9:00 AM–5:00 PM</div></div>
      </div>
      <form id="contact-form">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Enter your name" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us how we can help" required></textarea>
        <button type="submit">Send message <span aria-hidden="true">→</span></button>
        <p id="form-status" class="form-status" role="status"></p>
      </form>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="js/header.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
