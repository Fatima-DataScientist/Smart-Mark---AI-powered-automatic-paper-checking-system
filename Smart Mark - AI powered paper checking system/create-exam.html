<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Exam — SmartMark</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/create-exam.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="logo" href="dashboard.html">Smart<span>Mark</span></a><div class="nav-section-label">Main</div><a class="nav-item" href="dashboard.html"><span class="nav-icon">▦</span>Dashboard</a><a class="nav-item" href="my-exams.html"><span class="nav-icon">▤</span>My Exams</a><a class="nav-item active" href="create-exam.html"><span class="nav-icon">＋</span>Create Exam</a><a class="nav-item" href="class-selection.html"><span class="nav-icon">▥</span>Analytics</a><a class="nav-item" href="export-reports.html"><span class="nav-icon">▣</span>Report Cards</a><div class="nav-section-label account-label">Account</div><a class="nav-item" href="settings.html"><span class="nav-icon">⚙</span>Settings</a><button class="nav-item logout-button" type="button" data-logout><span class="nav-icon">↪</span>Logout</button><div class="spacer"></div><div class="sidebar-footer"><span class="avatar">PS</span><div><strong>Priya Sharma</strong><small>Teacher</small></div></div></aside><main class="main-content"><div class="breadcrumb"><a href="my-exams.html">My Exams</a> <span>/ Create New Exam</span></div><h1>Create Exam</h1><div class="stepper"><div class="step current"><b>1</b><span>Exam Details</span></div><i></i><div class="step"><b>2</b><span>Upload Sheets</span></div><i></i><div class="step"><b>3</b><span>Marking Scheme</span></div><i></i><div class="step"><b>4</b><span>Answer Key</span></div></div><form class="form-card" id="exam-form"><h2>Exam details</h2><p>Basic information about this exam. You can edit these later.</p><label>Exam title<input id="exam-title" required placeholder="Enter Exam Title"></label><div class="two"><label>Course / Subject<input required placeholder="Enter Course / Subject"></label><label>Class / Section<input required placeholder="Enter Class / Section"></label></div><div class="three"><label>Exam date<input type="date" required></label><label>Total marks<input type="number" min="1" required placeholder="Enter Total Marks"></label><label>Number of questions<input type="number" min="1" required placeholder="Enter Number of questions"></label></div><label>Class sections <em>(optional — press Enter to add)</em><div class="tag-box" id="tag-box"><span class="tag">BSDS-23-M<button type="button">×</button></span><span class="tag">BSDS-23-A<button type="button">×</button></span><input id="section-input" placeholder="Add a section…"></div></label><label>Notes <em>(optional)</em><textarea placeholder="Any special instructions for grading this exam..."></textarea></label><div class="form-footer"><button class="draft" type="button" id="save-draft">Save as draft</button><div><a class="btn cancel" href="my-exams.html">Cancel</a><button class="btn primary" type="submit">Next: Upload Sheets →</button></div></div></form></main></div><div class="toast" role="status" aria-live="polite"></div><script src="js/create-exam.js"></script><script src="js/navigation.js"></script></body></html>
